<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header>
    <div class="left">
        <img src="imagini/A-logo-01.png" class="logo" id="logo-btn">
    </div>

    <div class="center">
        <h4 id="home-btn">Alan Jiglitchi</h4>
    </div>

    <div class="right">
        <img src="imagini/sun-74.png" class="theme-changer" id="themeBtn">
        <h3 id="profile-btn">Profile</h3>
        <h3 id="projects-btn">Projects</h3>
        <h3>Contact</h3>
    </div>
</header>

<!-- LIVE FORM -->
<div class="live-container">
    <form id="live-form">
        <input type="text" id="live-input" placeholder="Scrie ceva...">
    </form>

    <p id="live-output"></p>
</div>

<div id="search-bar-container" class="search-hidden">
    <input type="text" id="search-input" placeholder="Search projects...">
</div>

<div id="main-content">
    <div class="rectangle">
        <h2>This is my portfolio!</h2>
        <img src="imagini/blurred-man.png" class="image">
    </div>
</div>

<!-- PROJECTS -->
<div id="projects-section" style="display:none;">
    <div class="projects-container" id="projects-container">
    </div>

    <!-- ADD IMAGE BY LINK -->
    <div class="add-image-container">
        <input type="text" id="image-link-input" placeholder="Pune link-ul imaginii aici...">
        <button id="add-image-btn">Add Image</button>
    </div>
</div>

<!-- PROFILE -->
<div id="profile-section" style="display:none;">
    <div class="profile-card">
        <img src="imagini/zoro.jpg" id="profile-image">
        <h2>My Profile</h2>
        <p id="bio-text">
            My name is Alan. I'm 17 years old. I am a student at the CUTM,
            2nd year. My specialty is Web-Designer.
            I hope you like my customized portfolio
        </p>
    </div>
</div>

<p id="test-click" style="cursor:pointer; font-size:20px; color:white;">
    Apasă pe mine
</p>

<script src="index.js"></script>
</body>
</html>
